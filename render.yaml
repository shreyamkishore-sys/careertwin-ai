services:
  - type: web
    name: careertwin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careertwin-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: careertwin-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CAREERTWIN_ENVIRONMENT
        value: production
      - key: CAREERTWIN_COOKIE_SECURE
        value: "true"

  - type: web
    name: careertwin-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://careertwin-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: careertwin-db
    plan: 0.1c-256mb
    databaseName: careertwin
    user: careertwin
